name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly, catches changes in new palace releases

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install palace (latest palace-rs release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/palace" && cd "$RUNNER_TEMP/palace"
          gh release download --repo AncientiCe/palace-rs \
            --pattern "palace-*-x86_64-unknown-linux-gnu.tar.gz" \
            --pattern "palace-x86_64-unknown-linux-gnu.sha256"
          sha256sum -c palace-x86_64-unknown-linux-gnu.sha256
          tar xzf palace-*-x86_64-unknown-linux-gnu.tar.gz
          bin="$(ls "$PWD"/palace-*-x86_64-unknown-linux-gnu/palace)"
          test -x "$bin" && "$bin" --version
          echo "PALACE_BIN=$bin" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/home"
      - name: Install package
        run: pip install -e '.[test]'
      - name: Run tests against the real palace binary
        env:
          HOME: ${{ runner.temp }}/home
        run: pytest -q -rs
      - name: Build sdist and wheel
        run: pipx run build
